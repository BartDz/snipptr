name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker-compose up -d --build

      - name: Wait for services
        run: sleep 10

      - name: Run tests
        run: docker-compose exec -T app ./vendor/bin/phpunit --testdox

      - name: Stop services
        if: always()
        run: docker-compose down
